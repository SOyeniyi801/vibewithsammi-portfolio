    <style>
      :root {
        --blue: #2874e4;
        --yellow: #fff3b0;
        --black: #121212;
        --white: #ffffff;
        --shadow: 7px 7px 0 var(--black);
        --radius: 999px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--blue);
        color: var(--black);
        font-family: "Manrope", sans-serif;
        padding: 48px 20px;
      }

      a {
        color: inherit;
      }

      .page {
        width: min(100%, 640px);
        margin: 0 auto;
      }

      /* PROFILE */

      .profile {
        text-align: center;
        margin-bottom: 38px;
      }

      .avatar-wrap {
        width: 138px;
        height: 138px;
        margin: 0 auto 20px;
        border: 3px solid var(--black);
        border-radius: 50%;
        background: var(--yellow);
        box-shadow: 7px 7px 0 var(--black);
        overflow: hidden;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .avatar-wrap:hover {
        transform: translate(3px, 3px) rotate(2deg);
        box-shadow: 4px 4px 0 var(--black);
      }

      .avatar {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .name {
        margin: 0;
        font-family: "Chango", display;
        color: var(--white);
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .tagline {
        margin: 13px 0 19px;
        color: var(--white);
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .socials {
        display: flex;
        justify-content: center;
        gap: 11px;
        flex-wrap: wrap;
      }

      .social-link {
        display: grid;
        place-items: center;
        width: 43px;
        height: 43px;
        background: var(--yellow);
        border: 2px solid var(--black);
        border-radius: 50%;
        box-shadow: 4px 4px 0 var(--black);
        text-decoration: none;
        font-size: 1.1rem;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      .social-link:hover {
        transform: translate(2px, 2px) rotate(-4deg);
        box-shadow: 2px 2px 0 var(--black);
        background: var(--white);
      }

      /* LINKS */

      .links {
        display: grid;
        gap: 18px;
      }

      .link-button {
        position: relative;
        display: flex;
        align-items: center;
        gap: 17px;

        min-height: 82px;
        padding: 15px 26px 15px 18px;

        background: var(--yellow);
        border: 3px solid var(--black);
        border-radius: var(--radius);
        box-shadow: var(--shadow);

        color: var(--black);
        text-decoration: none;

        transition:
          transform 170ms cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 170ms cubic-bezier(0.2, 0.8, 0.2, 1),
          background 170ms ease;
      }

      .link-button:hover {
        transform: translate(5px, 5px);
        box-shadow: 2px 2px 0 var(--black);
        background: var(--white);
      }

      .link-button:active {
        transform: translate(7px, 7px);
        box-shadow: 0 0 0 var(--black);
      }

      .link-icon {
        flex: 0 0 auto;

        display: grid;
        place-items: center;

        width: 49px;
        height: 49px;

        border: 2px solid var(--black);
        border-radius: 50%;

        background: var(--blue);
        color: var(--white);

        font-size: 1rem;

        transition: transform 200ms ease;
      }

      .link-button:hover .link-icon {
        transform: rotate(-8deg) scale(1.05);
      }

      .link-content {
        flex: 1;
        min-width: 0;
      }

      .link-title {
        display: block;
        font-weight: 800;
        font-size: 1.06rem;
        line-height: 1.2;
      }

      .link-description {
        display: block;
        margin-top: 3px;
        font-size: 0.78rem;
        font-weight: 600;
        opacity: 0.65;
      }

      .arrow {
        margin-left: auto;
        font-size: 1rem;
        transition: transform 180ms ease;
      }

      .link-button:hover .arrow {
        transform: translateX(4px) rotate(-10deg);
      }

      /* LITTLE DECORATIVE STAR */

      .star {
        position: fixed;
        color: var(--yellow);
        font-size: clamp(40px, 8vw, 80px);
        font-weight: 800;
        pointer-events: none;
        -webkit-user-select:none;
        user-select: none;
        opacity: 0.95;
      }

      .star-one {
        top: 7%;
        left: 7%;
        transform: rotate(-12deg);
      }

      .star-two {
        bottom: 8%;
        right: 7%;
        transform: rotate(13deg);
      }

      /* FOOTER */

      footer {
        margin-top: 42px;
        text-align: center;
        color: var(--white);
        font-size: 0.78rem;
        font-weight: 600;
      }

      footer a {
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .footer-container {
        display: flex;
        flex-direction: column;
      }

      @media (max-width: 520px) {
        body {
          padding-top: 38px;
        }

        .avatar-wrap {
          width: 120px;
          height: 120px;
        }

        .link-button {
          min-height: 74px;
          padding-right: 20px;
        }

        .link-icon {
          width: 44px;
          height: 44px;
        }

        .link-description {
          font-size: 0.74rem;
        }

        .star {
          opacity: 0.35;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
